services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=tempadmin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=tempadminpass
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      dockerfile: weather-api/Dockerfile
    environment:
      - CLIENT_SECRET
    depends_on:
      - keycloak

  ui:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./ui/nginx.conf:/etc/nginx/nginx.conf
      - ./ui/index.html:/usr/share/nginx/html/index.html
      - ./ui/login.html:/usr/share/nginx/html/login.html
    depends_on:
      - api